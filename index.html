<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The favicon is the alley mark in champagne gold. It was the emerald mark,
      which is invisible on a dark tab bar (1.4:1 against #202124); gold holds
      at about 6.6:1 there and is still legible on a light tab at 1.9:1. White
      was the other candidate and loses on light — 1.3:1, i.e. gone.

      64px is all a tab needs (16px at 4x DPI, bookmarks bar at 2x). iOS paints
      transparency black, so the touch icon is the same gold seal on the
      console's deep emerald plate instead of a cut-out.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-gold.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Beauty Alley — an elegant salon operating system for client tracking, booking, QR check-in and live monitoring."
    />
    <meta name="theme-color" content="#1B4D3E" />
    <title>The Beauty Alley · Salon OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cormorant Garamond is the editorial face for the public site.
      Plus Jakarta Sans is the UI face for the whole app — every form, table,
      button and navigation item, and (via the `.console` scope) every
      dashboard heading too. Both are referenced through the `--font-*`
      variables in `src/index.css`.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
