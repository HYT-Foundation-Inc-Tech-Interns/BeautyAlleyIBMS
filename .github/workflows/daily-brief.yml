name: Daily brief

# The owner's morning email: yesterday's takings, chair-hours, rebookings and
# the one thing that looks wrong. The sender is a script, not a request path,
# for the same reason the reminder sender is: a slow SMTP handshake must not
# sit inside anything a person is waiting on.
#
# 23:00 UTC is 07:00 in Manila. GitHub's schedule is best-effort and can run
# late; the brief is for the *previous* branch day whatever hour it actually
# runs, and `daily_briefs` stops a late or doubled run from sending twice.
#
# Configure these repository secrets before relying on it:
#   DATABASE_URL, SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM
# and optionally:
#   BRIEF_RECIPIENTS            (defaults to the address in SMTP_FROM)
#   DAILY_REVENUE_TARGET_CENTS  (unset: no percentage against target)
#
# Without DATABASE_URL the job exits green and does nothing, so a fork or a new
# clone is not red for lacking the salon's credentials.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  send:
    name: Send the owner's brief
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Is the brief configured?
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set; skipping the brief."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install backend dependencies
        if: steps.config.outputs.skip != 'true'
        working-directory: backend
        run: npm ci

      - name: Send
        if: steps.config.outputs.skip != 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BRIEF_RECIPIENTS: ${{ secrets.BRIEF_RECIPIENTS }}
          DAILY_REVENUE_TARGET_CENTS: ${{ vars.DAILY_REVENUE_TARGET_CENTS }}
          BRANCH_TIMEZONE: ${{ vars.BRANCH_TIMEZONE || 'Asia/Manila' }}
        run: npm run brief
